# Phase 5 M2 产业图谱首版本体种子（架构评审修正版）。
# 确定性只读文件；节点和边由 ontology.py 加载器和 Research CLI seed 命令读入。
# 禁止人工直接编辑 JSON 后反写数据库。
#
# 种子规则：
#   - 所有节点 version=1, origin_kind=governance_seed, review_status=approved
#   - 所有边 assertion_type=GOVERNANCE, version=1, review_status=approved
#   - 禁止 Company 类型（governance seed 范围限定 Industry + IndustrySegment）
#   - 禁止除 BELONGS_TO 以外的 relation（首版骨架只支持分类关系）
#   - BELONGS_TO 方向：child → parent（IndustrySegment → Industry）
#   - 节点严格仅含 node_id/node_type/name；无 aliases/description

