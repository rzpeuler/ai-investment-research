# 数据需求注册表（Phase 1 任务 8.1 节）
# 主源失败后才使用备源；备源结果不得伪装成主源；
# 最低字段不满足时返回 insufficient_data；禁止估算缺失值；
# 禁止把空响应解释为"没有事件"。

requirements:
  company_announcement:
    primary:
      - cninfo
    secondary:
      - sse
      - szse
    fallback:
      - company_ir
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
        - company
    failure_policy: degraded

  macro_data:
    primary:
      - nbs
    secondary:
      - csrc
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - publish_date
        - url
    failure_policy: degraded

  market_realtime_snapshot:
    description: 单个证券当前交易日的实时或延迟快照（Phase 1.1 拆分）
    primary:
      - sina_quote
    secondary: []
    fallback: []
    minimum_acceptable:
      fields:
        - symbol
        - observed_at
        - open
        - high
        - low
        - last_price
        - volume
    failure_policy: insufficient_data

  market_daily_ohlcv:
    description: 带有明确交易日期的历史日线序列（Phase 1.1 修正：实时快照源不得用于日线；Phase 3 起支持 manual_import 导入批次，见 market_daily_series_manifest）
    primary: []
    secondary: []
    fallback:
      - manual_import
    minimum_acceptable:
      fields:
        - trade_date
        - open
        - high
        - low
        - close
        - volume
    failure_policy: insufficient_data

  market_minute_bar:
    description: 分钟级行情（Phase 3 仅完成 Schema、Pydantic 模型与 Loader Protocol；不创建虚构分钟源）
    primary: []
    secondary: []
    fallback: []
    minimum_acceptable:
      fields:
        - symbol
        - trade_date
        - bar_time
        - interval
        - open
        - high
        - low
        - close
        - volume
    failure_policy: insufficient_data

  news_flash:
    primary:
      - cls
    secondary: []
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
    failure_policy: degraded

  # ===== P7-D0 Brief canonical requirements（只声明业务需求存在，不接来源）=====
  brief_event_content:
    description: Brief A 的统一 canonical 事件内容需求（P7-D0）。覆盖需求文档其他新事件方向；本阶段 primary/secondary 为空，仅声明需求存在，不宣称自动覆盖。
    primary: []
    secondary: []
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
    failure_policy: degraded
    notes: FAST_NEWS ∈ A；禁止偷偷接来源；fallback 仅复用已存在的人工入口

  brief_attention_content:
    description: Brief C 的窗口关注度内容需求（P7-D0）。一次性窗口扫描名单内容；本阶段 primary/secondary 为空，不接来源。
    primary: []
    secondary: []
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
    failure_policy: degraded
    notes: 无来源时如实 not_covered；不得把"没有采集成功"解释成"没有市场关注"

  # ===== Phase 4 数据需求（Phase 4 任务书 5.6 节）=====
  company_profile:
    description: 公司主体主数据（有效期内；含统一社会信用代码、行业、实控人等）
    primary: []
    secondary: []
    fallback:
      - manual_inbox
      - user_document
    minimum_acceptable:
      fields:
        - canonical_name
        - fiscal_year_end
        - reporting_currency
    failure_policy: insufficient_data
    notes: 无自动来源前只允许人工登记；禁止估算缺失字段

  security_profile:
    description: 证券与公司主体映射（symbol/exchange/board/股本变化）
    primary: []
    secondary: []
    fallback:
      - manual_inbox
      - user_document
    minimum_acceptable:
      fields:
        - symbol
        - exchange
        - security_type
        - current_name
    failure_policy: insufficient_data

  company_document:
    description: 公司公告/定期报告文档登记（哈希/页码/表格块；不保存不必要全文）
    primary:
      - cninfo
    secondary:
      - sse
      - szse
    fallback:
      - user_document
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - document_type
    failure_policy: degraded
    notes: 文档元数据可来自法定披露适配器；文档内容解析成功后才能生成财务事实

  financial_statement_data:
    description: 标准财务科目事实（三表/附注/经营数据；Decimal 字符串持久化）
    primary: []
    secondary: []
    fallback:
      - manual_financial_import
      - disclosure_extraction
    minimum_acceptable:
      fields:
        - fact_key
        - period_end
        - statement_scope
        - value
    failure_policy: insufficient_data
    notes: 未验证的自动财务源不得登记为 primary/secondary；第 6 级来源不能单独生成财务 FACT

  financial_segment_data:
    description: 业务/产品/地区分部数据（raw_name/canonical_name/重分类）
    primary: []
    secondary: []
    fallback:
      - manual_financial_import
      - disclosure_extraction
    minimum_acceptable:
      fields:
        - segment_type
        - raw_name
        - revenue
    failure_policy: insufficient_data
    notes: 不得把跨期不同分类直接相加

  market_valuation_snapshot:
    description: 市值/价格/股本等估值输入（时点对齐）
    primary: []
    secondary: []
    fallback:
      - manual_inbox
      - manual_financial_import
    minimum_acceptable:
      fields:
        - as_of
        - price
        - shares_outstanding
    failure_policy: insufficient_data
    notes: 实时快照源不得用于历史估值基线；市值=价格×股本要求时点一致

  shares_outstanding_history:
    description: 总股本/加权股本历史序列（拆股/增发单列）
    primary: []
    secondary: []
    fallback:
      - manual_financial_import
    minimum_acceptable:
      fields:
        - as_of
        - shares_outstanding
    failure_policy: insufficient_data

  industry_membership:
    description: 公司行业归属（截止日前有效；同行宇宙输入）
    primary: []
    secondary: []
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - industry_id
        - valid_from
    failure_policy: insufficient_data
    notes: 同行关系 relationship_valid_from 不得晚于 information_cutoff

  peer_financial_data:
    description: 同行公司财务数据（同行比较与分位；未验证来源不得写入 primary）
    primary: []
    secondary: []
    fallback:
      - manual_financial_import
    minimum_acceptable:
      fields:
        - company_entity_id
        - period_end
        - fact_key
        - value
    failure_policy: insufficient_data
    notes: 同行样本 <3 时降级 insufficient_peer_sample，不输出正式分位
