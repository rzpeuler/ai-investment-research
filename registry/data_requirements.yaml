# 数据需求注册表（Phase 1 任务 8.1 节）
# 主源失败后才使用备源；备源结果不得伪装成主源；
# 最低字段不满足时返回 insufficient_data；禁止估算缺失值；
# 禁止把空响应解释为"没有事件"。

requirements:
  company_announcement:
    primary:
      - cninfo
    secondary:
      - sse
      - szse
    fallback:
      - company_ir
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
        - company
    failure_policy: degraded

  macro_data:
    primary:
      - nbs
    secondary:
      - csrc
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - publish_date
        - url
    failure_policy: degraded

  market_realtime_snapshot:
    description: 单个证券当前交易日的实时或延迟快照（Phase 1.1 拆分）
    primary:
      - sina_quote
    secondary: []
    fallback: []
    minimum_acceptable:
      fields:
        - symbol
        - observed_at
        - open
        - high
        - low
        - last_price
        - volume
    failure_policy: insufficient_data

  market_daily_ohlcv:
    description: 带有明确交易日期的历史日线序列（Phase 1.1 修正：实时快照源不得用于日线；Phase 3 起支持 manual_import 导入批次，见 market_daily_series_manifest）
    primary: []
    secondary: []
    fallback:
      - manual_import
    minimum_acceptable:
      fields:
        - trade_date
        - open
        - high
        - low
        - close
        - volume
    failure_policy: insufficient_data

  market_minute_bar:
    description: 分钟级行情（Phase 3 仅完成 Schema、Pydantic 模型与 Loader Protocol；不创建虚构分钟源）
    primary: []
    secondary: []
    fallback: []
    minimum_acceptable:
      fields:
        - symbol
        - trade_date
        - bar_time
        - interval
        - open
        - high
        - low
        - close
        - volume
    failure_policy: insufficient_data

  news_flash:
    primary:
      - cls
    secondary: []
    fallback:
      - manual_inbox
    minimum_acceptable:
      fields:
        - title
        - published_at
        - url
    failure_policy: degraded
