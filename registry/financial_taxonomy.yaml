# 期间与口径（periods.py 使用）
periods:
  - code: FY
    name: 年报
    duration_months: 12
  - code: H1
    name: 中报
    duration_months: 6
  - code: Q1
    name: 一季报
    duration_months: 3
  - code: Q3
    name: 三季报
    duration_months: 9

scopes:
  - code: consolidated
    name: 合并口径
    default: true
  - code: parent
    name: 母公司口径
    default: false

standards:
  - code: CAS
    name: 中国企业会计准则
  - code: IFRS
    name: 国际财务报告准则
  - code: OTHER
    name: 其他

units:
  - code: yuan
    name: 元
    scale: 1
  - code: thousand_yuan
    name: 千元
    scale: 1000
  - code: ten_thousand_yuan
    name: 万元
    scale: 10000
  - code: hundred_million_yuan
    name: 亿元
    scale: 100000000
  - code: share
    name: 股
    scale: 1
