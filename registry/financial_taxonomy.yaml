# 财务科目分类注册表（Phase 4 任务书 3.7/Commit 5 使用）
# 规则：
# - taxonomy_code 为标准化后的权威科目代码，原始科目名通过 taxonomy 映射到标准科目；
# - 映射只产生候选，LLM 不得直接定稿；低置信映射须人工确认；
# - 版本号变化须进 FinancialMetric.formula_version / 幂等键。

version: "1.0.0"
updated_at: "2026-08-06"

statements:
  - code: income_statement
    name: 利润表
  - code: balance_sheet
    name: 资产负债表
  - code: cash_flow
    name: 现金流量表
  - code: equity_statement
    name: 所有者权益变动表
  - code: note
    name: 附注
  - code: operating_data
    name: 经营数据

# 标准科目（科目→taxonomy_code；同义原始名可多行）
subjects:
  revenue:
    canonical: 营业收入
    synonyms:
      - 营业总收入
      - 主营业务收入
      - 营业收入合计
    statement: income_statement
    instant_or_duration: duration

