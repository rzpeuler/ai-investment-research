# 场景数据需求注册表（P7-D0）
# 场景只声明需要什么 Data Type，不声明具体来源（禁止来源选择字段进入）。
# 来源选择由 DataRequirement Registry + Router 决定。
# 本注册表只登记真实需求；无自动来源时如实体现 MISSING / MANUAL_REQUIRED / NOT_ACQUIRABLE。

scenarios:
  morning_brief:
    description: 晨报（窗口 D-1 20:00 → D 08:00，由 BriefWindowPolicy 决定，不在本注册表重算）
    requirements:
      - requirement_id: morning_brief.event.news_flash
        scenario: morning_brief
        purpose: brief_event_discovery
        data_type: news_flash
        scope: { scope_type: global }
        time_policy: scenario_window
        required: true
        minimum_fields: [title, published_at, url]
        minimum_coverage: 0.5
        minimum_source_tier: B
        freshness_seconds: 43200
        point_in_time_policy: window_bounded
        acceptable_fallback_modes: [manual_inbox]
        degradation_policy: degraded
        notes: 7×24 快讯属于 A（FAST_NEWS ∈ A），不属于 C
      - requirement_id: morning_brief.event.company_announcement
        scenario: morning_brief
        purpose: brief_event_discovery
        data_type: company_announcement
        scope: { scope_type: global }
        time_policy: scenario_window
        required: true
        minimum_fields: [title, published_at, url, company]
        minimum_coverage: 0.5
        minimum_source_tier: A
        freshness_seconds: 43200
        point_in_time_policy: window_bounded
        acceptable_fallback_modes: [manual_inbox]
        degradation_policy: degraded
        notes: 公司公告（法定披露优先）
      - requirement_id: morning_brief.event.macro_data
        scenario: morning_brief
        purpose: brief_event_discovery
        data_type: macro_data
        scope: { scope_type: global }
        time_policy: scenario_window
        required: true
        minimum_fields: [title, publish_date, url]
        minimum_coverage: 0.5
        minimum_source_tier: A
        freshness_seconds: 43200
        point_in_time_policy: window_bounded
        acceptable_fallback_modes: [manual_inbox]
        degradation_policy: degraded
        notes: 宏观数据发布
      - requirement_id: morning_brief.event.brief_event_content
        scenario: morning_brief
        purpose: brief_event_discovery
        data_type: brief_event_content
        scope: { scope_type: global }
        time_policy: scenario_window
        required: false
        minimum_fields: [title, published_at, url]
        minimum_coverage: 0.0
        minimum_source_tier: D
        freshness_seconds: 43200
        point_in_time_policy: window_bounded
        acceptable_fallback_modes: [manual_inbox]
        degradation_policy: degraded
        notes: 需求文档其他新事件方向的统一 canonical requirement；primary/secondary 为空，仅声明需求存在
      - requirement_id: morning_brief.attention.brief_attention_content
        scenario: morning_brief
        purpose: brief_attention_monitoring
        data_type: brief_attention_content
        scope: { scope_type: watchlist, watchlist_group: brief_watchlist }
        time_policy: scenario_window
        required: false
        minimum_fields: [title, published_at, url]
        minimum_coverage: 0.0
        minimum_source_tier: D
        freshness_seconds: 43200
        point_in_time_policy: window_bounded
        acceptable_fallback_modes: [manual_inbox]
        degradation_policy: degraded
        notes: Requirement C；一次性窗口关注度扫描，非持续监控；无来源时如实 not_covered

