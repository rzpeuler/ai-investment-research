    requires_governed_workflow: false
    source_tier_applicable: true
    implementation_refs:
      - src/research_os/collectors/official/cninfo.py
    notes: P7-D3 完成 production wiring（SourceQueryProjector + FieldProjector + allowlist）；WORKFLOW_WIRED。真实在线验收通过并由治理 closeout 后才允许 BUSINESS_SUFFICIENT

  company_document:
