# 数据获取能力注册表（P7-D1）
# 只回答：系统当前对某 Data Type 到底会不会做某类补充动作？
# 不是 Source Registry：禁止来源选择字段（来源选择属于 data_requirements.yaml + Router）。
# 生命周期枚举：NONE / REGISTERED / PROBED / ADAPTER_IMPLEMENTED / WORKFLOW_WIRED / BUSINESS_SUFFICIENT
# 规则：存在 Source Registry entry != AUTO_ACQUIRABLE；只有 BUSINESS_SUFFICIENT 才允许
#       GapClassifier 输出 AUTO_ACQUIRABLE / STALE_REFRESHABLE（保守规则）。

capabilities:
  news_flash:
    automatic_acquisition_lifecycle: ADAPTER_IMPLEMENTED
    deterministic_derivation: false
    manual_modes: [manual_inbox]
    requires_human_review: false
    requires_governed_workflow: false
    source_tier_applicable: true
    implementation_refs:
      - src/research_os/collectors/news/cls.py
    notes: cls 元数据适配器已实现但属实验性 B 级（brief/collect.py append_live_items 可选接入）；未证明业务充分，不得 AUTO_ACQUIRABLE

