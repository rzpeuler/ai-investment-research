name: P8-B2-EVAL-001 Harness Quality Benchmark

# P8-B2-EVAL-001: runs the harness quality benchmark corpus (10 live cases
# through the pinned Harness + legacy reference, 3 deterministic failure
# cases), collects quality/reliability/cost/compatibility metrics and
# evaluates the P8-B3 entry thresholds. The benchmark corpus is COMPLETELY
# DECOUPLED from the P8-B2-LIVE-01 acceptance corpus. Opt-in via
# P8_B2_HARNESS_BENCHMARK=1; default runtime remains legacy.
# The credential is injected ONLY via the GitHub Actions secret mechanism.
# workflow_dispatch resolves workflows from the default branch only, so this
# branch-local workflow also triggered on pushes to the R4 optimization branch;
# the R4 benchmark iterations completed (2026-08-21); the push trigger is
# removed to prevent accidental re-runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8-b2-eval-001
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: pip install ".[dev]"

      - name: Install pinned Harness (npm ci)
        working-directory: agent_runtime
        run: npm ci

      - name: Provision Research OS authority (deterministic v6 + corpus profiles)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path
          from research_os.agent_runtime.production_runtime import ROOT
          from research_os.storage import Database
          db_path = ROOT / "data" / "sqlite" / "research.db"
          db = Database(db_path)
          db.initialize()
          rows = [
              {"security_profile_id": "714a4b94-3c9c-5ba6-b5ff-3bd34e485665",
               "payload": {"security_profile_id": "714a4b94-3c9c-5ba6-b5ff-3bd34e485665",
                           "symbol": "600519.SH", "exchange": "SH", "status": "listed", "version": 1,
                           "security_entity_id": "security:600519.SH",
                           "company_entity_id": "company:maotai", "name": "贵州茅台",
                           "company_name": "贵州茅台酒股份有限公司"},
               "security_entity_id": "security:600519.SH", "company_entity_id": "company:maotai",
               "symbol": "600519.SH", "exchange": "SH", "status": "listed", "version": 1},
              {"security_profile_id": "f023225b-3a5f-5851-800e-3560482918b7",
               "payload": {"security_profile_id": "f023225b-3a5f-5851-800e-3560482918b7",
                           "symbol": "300750.SZ", "exchange": "SZ", "status": "listed", "version": 1,
                           "security_entity_id": "security:300750.SZ",
                           "company_entity_id": "company:catl", "name": "宁德时代",
                           "company_name": "宁德时代新能源科技股份有限公司"},
               "security_entity_id": "security:300750.SZ", "company_entity_id": "company:catl",
               "symbol": "300750.SZ", "exchange": "SZ", "status": "listed", "version": 1},
          ]
          for row in rows:
              db._conn.execute(
                  "INSERT OR REPLACE INTO security_profiles "
                  "(security_profile_id, payload, security_entity_id, company_entity_id, symbol, exchange, status, version) "
                  "VALUES (?,?,?,?,?,?,?,?)",
                  (row["security_profile_id"], json.dumps(row["payload"], ensure_ascii=False),
                   row["security_entity_id"], row["company_entity_id"], row["symbol"],
                   row["exchange"], row["status"], row["version"]))
          db._conn.commit()
          print("AUTHORITY_PROVISIONED", db._conn.execute("PRAGMA user_version").fetchone()[0])
          db._conn.close()
          PYEOF

      - name: Run harness quality benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          P8_B2_HARNESS_BENCHMARK: "1"
        timeout-minutes: 120
        run: |
          set +e
          PYTHONPATH=src python scripts/run_harness_benchmark.py
          code=$?
          set -e
          echo "BENCHMARK_EXIT_CODE=$code"
          if grep -q "BLOCKED_CREDENTIAL_UNAVAILABLE" <(PYTHONPATH=src python scripts/run_harness_benchmark.py 2>/dev/null || true); then
            echo "BLOCKED_CREDENTIAL_UNAVAILABLE"
            exit 3
          fi
          exit "$code"

      - name: Benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-benchmark-report
          path: reports/harness_benchmark_latest.json
          if-no-files-found: error

      - name: Targeted P8-B2 tests
        run: python -m pytest tests/unit/test_p8_b2_harness_benchmark.py tests/unit/test_p8_b2_harness_output_normalization.py tests/unit/test_p8_b2_harness_llm_entry.py -q

      - name: Full pytest
        run: python -m pytest

      - name: Validate schemas
        run: python -m research_os.cli.main validate

      - name: Compile
        run: python -m compileall -q src scripts tests
