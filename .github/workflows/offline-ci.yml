name: Offline CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install
        run: pip install ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Validate schemas
        run: python -m research_os.cli.main validate

      - name: Compile
        run: python -m compileall -q src tests
